unat:()=>{S.att=null;$('#at').innerHTML=''},
share:async d=>{const u=location.href;try{if(navigator.share)await navigator.share({title:d.n,url:u});else{await navigator.clipboard.writeText(u);toast('Ссылка скопирована')}}catch(e){}},
pick:async()=>{const{data}=await sb.from('apps').select('id,name,version,kind,icon_url').eq('status','approved').order('name').limit(60);const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="dc pk"><h2>Прикрепить приложение</h2><div class="pl2">${(data||[]).map((a,i)=>`<button class="row" data-id="${esc(a.id)}" data-n="${esc(a.name)}">${ic(a,i)}<b>${esc(a.name)}</b></button>`).join('')||'<p class="sm">Каталог пуст</p>'}</div><button class="btn o big" style="height:48px">Закрыть</button></div>`;document.body.appendChild(d);d.onclick=e=>{const b=e.target.closest('button.row');if(b){S.att=b.dataset.id;$('#at').innerHTML=`<span class="chip">▦ ${esc(b.dataset.n)}<button class="x" data-a="unat">×</button></span>`;d.remove()}else if(e.target==d||e.target.closest('.big'))d.remove()}},
send:async d=>{const t=$('#mb').value.trim();if(!t&&!S.att)return;const body=(t+(S.att?'\n[[app:'+S.att+']]':'')).trim();const{error}=await sb.from('messages').insert({to_id:d.id,body});if(error)return toast('Не отправлено: возможно, пользователь отключил сообщения');$('#mb').value='';S.att=null;$('#at').innerHTML='';const b=$('#ms');if(b)delete b.dataset.k;await refDlg(d.id,true)},
login:()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}}),
logout:async()=>{await sb.auth.signOut();location.hash='#/'},
f:d=>{S.filter=d.k;route()},tab:d=>{S.tab=d.k;route()},
pk:d=>$(d.t=='apk'?'#apk':'#ico').click(),
st:d=>{S.rate=+d.n;document.querySelectorAll('#rt button').forEach((b,i)=>b.textContent=i<S.rate?'★':'☆')},
dl:async(d,el)=>{const{data,error}=await sb.storage.from('apks').createSignedUrl(d.p,300,{download:true});if(error)return toast(error.message);
const old=el.outerHTML,box=document.createElement('div');box.className='dlb';box.innerHTML='<div class="dt"><span>Загрузка…</span><b>0%</b></div><div class="wp"><i></i></div>';el.replaceWith(box);
const lb=box.querySelector('b'),fi=box.querySelector('i'),st=box.querySelector('.dt span'),set=p=>{fi.style.width=p+'%';lb.textContent=Math.round(p)+'%'};
try{const r=await fetch(data.signedUrl);if(!r.ok)throw new Error('HTTP '+r.status);const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;if(tot)set(got/tot*100);else lb.textContent=(got/1048576).toFixed(1)+' МБ'}
set(100);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'application/vnd.android.package-archive'}));a.download=(d.n||'app').replace(/[\\/:*?"<>|]/g,'_')+'.apk';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
st.textContent='✓ Готово';if(d.id)sb.rpc('inc_download',{app_id:String(d.id)}).then(()=>{},()=>{})
}catch(x){st.textContent='Скачивание в браузере…';location.href=data.signedUrl}
setTimeout(()=>{if(box.isConnected)box.outerHTML=old},3500)},
rv:async d=>{if(!S.rate)return toast('Выберите оценку');
if(!S.profile){toast('Сначала создайте профиль, чтобы подписывать отзывы своим именем');location.hash='#/dev';return}
const{error}=await sb.from('reviews').upsert({app_id:d.id,user_id:S.user.id,author_name:S.profile.name,author_avatar:S.profile.avatar_url||null,rating:S.rate,body:$('#rb').value.trim()},{onConflict:'app_id,user_id'});if(error)return toast(error.message);route()},
sub:async()=>{const n=$('#n').value.trim();if(!S.apk)return toast('Сначала выберите APK-файл');if(!n)return toast('Введите название');
$('#go').disabled=true;try{const{error}=await sb.from('apps').insert({owner_id:S.user.id,name:n,version:$('#v').value||'1.0',kind:$('#k').value,description:$('#d').value,apk_path:S.apk.path,icon_url:S.icon,size_bytes:S.apk.size});if(error)throw error;toast('Отправлено на проверку');location.hash='#/'}catch(e){toast(e.message);$('#go').disabled=false}},
sd:async()=>{const n=$('#dn').value.trim();if(!n)return toast('Введите имя');let av=S.profile?.avatar_url||null;const f=$('#av').files[0];
if(f)av=pub(await up('media',f,'avatar-'+f.name.replace(/[^\w.]/g,'_')));
const{error}=await sb.from('profiles').upsert({id:S.user.id,name:n,nick:$('#nk').value.trim().replace(/^@/,'')||null,bio:$('#bio').value,avatar_url:av,links:S.profile?.links||[],allow_messages:$('#am').checked});
if(error)return toast(error.message);const wasNew=!S.profile;await load('#/');toast(wasNew?'Аккаунт создан':'Сохранено')},
msg:async d=>{if(!S.user)return toast('Войдите');const body=$('#mb').value.trim();if(!body)return toast('Напишите сообщение');
const{error}=await sb.from('messages').insert({to_id:d.id,body});if(error)return toast('Не отправлено: возможно, пользователь отключил сообщения');$('#mb').value='';toast('Отправлено')},
st2:async d=>{const{error}=await sb.from('apps').update({status:d.s}).eq('id',d.id);if(error)return toast(error.message);route()},
bg:async d=>{const t=sb.from('app_badges');const{error}=d.on=='1'?await t.delete().eq('app_id',d.app).eq('badge_id',d.b):await t.insert({app_id:d.app,badge_id:d.b});if(error)return toast(error.message);route()}};

document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;try{await act[b.dataset.a](b.dataset,b)}catch(x){toast(x.message)}});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id=='q'){S.q=t.value;route()}
else if(t.id=='av'){const f=t.files[0];if(!f)return;const u=URL.createObjectURL(f),e=$('#avp');if(e.tagName=='IMG')e.src=u;else e.outerHTML=`<img id="avp" src="${u}" alt="">`}
else if(t.id=='apk'){const f=t.files[0];if(!f)return;if(f.size>52428800){toast('APK больше 50 МБ');return}
if(!$('#n').value)$('#n').value=f.name.replace(/\.apk$/i,'').replace(/[_-]+/g,' ');
$('#apkt').textContent=f.name;$('#aps').innerHTML=spin(22)+' Загрузка…';$('#go').disabled=true;S.apk=null;
try{S.apk={path:await up('apks',f,'app.apk'),size:f.size};$('#aps').textContent='✓ Загружено · '+(f.size/1048576).toFixed(1)+' МБ'}catch(x){$('#aps').textContent='Ошибка: '+x.message}
$('#go').disabled=false}
else if(t.id=='ico'){const f=t.files[0];if(!f)return;$('#icot').textContent=f.name;$('#ics').innerHTML=spin(22)+' Загрузка…';$('#go').disabled=true;S.icon=null;
try{S.icon=pub(await up('media',f,'icon-'+f.name.replace(/[^\w.]/g,'_')));$('#ics').textContent='✓ Загружено'}catch(x){$('#ics').textContent='Ошибка: '+x.message}
$('#go').disabled=false}});

async function pLogin(){if(S.user){location.hash='#/';return}
app.innerHTML=`<div class="lg"><div class="fl f1">${shape('cookie','#D0BCFF',150)}</div><div class="fl f2">${shape('star','#EFB8C8',96)}</div><div class="fl f3">${shape('flower','#9BD58A',120)}</div><div class="wl">Добро пожаловать<br>в You Store</div><button class="btn big" data-a="login">Войти через Google</button></div>`}
async function route(){const p=location.hash.split('/');const pg={app:pApp,upload:pUp,dev:pDev,admin:pAdm,login:pLogin,u:pUser,inbox:pChat,chat:pChat}[p[1]]||pCat;clearInterval(TM);clearInterval(CH);document.querySelectorAll('.cmp').forEach(e=>e.remove());try{await pg(p[2])}catch(e){shell(`<p>Ошибка: ${esc(e.message)}</p>`,'c')}}
async function load(go){const{data:{session}}=await sb.auth.getSession();S.user=session?.user||null;S.profile=null;S.admin=false;
if(S.user){S.profile=(await sb.from('profiles').select('*,profile_badges(badges(*))').eq('id',S.user.id).maybeSingle()).data;const r=await sb.rpc('is_admin');S.admin=r.data===true;if(r.error)toast('Проверка админа: '+r.error.message)}
if(go&&location.hash!==go)location.hash=go;else route()}
sb.auth.onAuthStateChange((e,s)=>{if((e=='SIGNED_IN'||e=='SIGNED_OUT')&&(s?.user?.id||null)!==(S.user?.id||null))setTimeout(()=>load(),0)});
addEventListener('hashchange',route);load();
</script></body></html>
